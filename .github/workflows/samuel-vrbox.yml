name: Samuel VR Box IPA

on:
  push:
    branches: [samuel/vrbox-ios]
    paths:
      - xr-kit/**
      - .github/workflows/samuel-vrbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify native crash patch
        run: python3 -m unittest discover -s xr-kit/tools -p 'test_string_patch.py' -v
      - name: Prepare Xcode and packager
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          command -v qemu-img || brew install qemu
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Build iPhone IPA
        run: bash xr-kit/tools/build_ipa.sh
      - name: Verify output archive and checksum
        run: |
          test -s xr-kit/dist/Samuel-VRBox.ipa
          unzip -tq xr-kit/dist/Samuel-VRBox.ipa
          shasum -a 256 xr-kit/dist/Samuel-VRBox.ipa | tee xr-kit/dist/Samuel-VRBox.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Samuel-VRBox-IPA
          path: |
            xr-kit/dist/Samuel-VRBox.ipa
            xr-kit/dist/Samuel-VRBox.sha256
          if-no-files-found: error