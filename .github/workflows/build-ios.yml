
name: Build Orchard IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ninja pkgconf glib pixman libslirp qemu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Fetch iOS dependencies
        run: bash scripts/fetch-ios-deps.sh

      - name: Build QEMU and Reims vGPU
        run: bash scripts/build-ios.sh

      - name: Build Orchard IPA
        run: bash ios/app/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Orchard-IPA
          path: ios/app/Orchard.ipa
          if-no-files-found: error
