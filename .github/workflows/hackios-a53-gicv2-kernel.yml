name: HackiOS actual Cortex-A53 GICv2 XNU build and QEMU boot (NO FLASH)
on:
  push:
    branches:
      - hackios-g611mt-exynos-probe-20261110
    paths:
      - "hackios-port/scripts/prepare-gicv2-xnu.py"
      - "hackios-port/scripts/prepare-gicv2-loader.py"
      - "hackios-port/experimental/gicv2-kernel.c"
      - ".github/workflows/hackios-a53-gicv2-kernel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gicv2-a53-real-xnu:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Install authentic XNU/UEFI build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git curl xz-utils tar gcc g++ make clang lld llvm \
            flex bison m4 perl python3 autoconf automake libtool uuid-dev libbsd-dev \
            qemu-system-arm qemu-efi-aarch64 file
      - name: Obtain pinned HakiOS upstream
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/oosexgang/hakios-xnu-kernel.git hakios
          git -C hakios fetch --depth 1 origin 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
          git -C hakios -c advice.detachedHead=false checkout --detach 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
          test "$(git -C hakios rev-parse HEAD)" = 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
      - name: Integrate Cortex-A53 GICv2 kernel/loader platform
        run: |
          python3 hackios-port/scripts/prepare-gicv2-xnu.py
      - name: Compile authentic XNU and run Cortex-A53 GICv2 QEMU
        run: |
          bash hakios-port/scripts/build-upstream-with-theos.sh
          test -s hakios/hakios-kernel
          cat ci-evidence/status.txt
          grep -F 'qemu_xnu_boot=PASS' ci-evidence/status.txt
          grep -F 'Hello from user space on Darwin!' hakios/logs/qemu-open.log
      - name: Save proof and logs, not an installable image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackios-real-a53-gicv2-xnu-qemu-evidence-NOT-FIRMWARE
          path: |
            ci-evidence/*.txt
            ci-evidence/*.log
            hakios/hakios-kernel
            hakios/xnu-build.log
            hakios/logs/qemu-open.log
          retention-days: 14
          if-no-files-found: warn
