name: HakiOS G611MT source provenance export (NO FIRMWARE)
on:
  push:
    branches:
      - hackios-g611mt-hakios-port-20261109
    paths:
      - ".github/workflows/hakios-g611mt-export.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-tracked-open-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned HakiOS source
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/oosexgang/hakios-xnu-kernel.git hakios-upstream
          git -C hakios-upstream fetch --depth 1 origin 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
          git -C hakios-upstream -c advice.detachedHead=false checkout --detach 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
          test "$(git -C hakios-upstream rev-parse HEAD)" = "63fc2b4633bac3af8e57dadab9f5a8d4cb940438"
      - name: Export actual tracked sources with upstream attribution
        run: |
          mkdir -p export/source/hakios-upstream export/source/g611mt-port export/source/u-boot-dt export/workflows
          cp hakios-upstream/{README.md,Makefile,LICENSE,LICENSE.APSL,NOTICE,COMPLIANCE.md,xnu-build.sh,xnu-env.sh} export/source/hakios-upstream/
          cp -a hakios-upstream/xnuloader export/source/hakios-upstream/
          cp -a hakios-upstream/xnu export/source/hakios-upstream/
          cp -a hakios-upstream/drivers export/source/hakios-upstream/
          cp -a hakios-upstream/configs export/source/hakios-upstream/
          cp -a hakios-upstream/tools export/source/hakios-upstream/
          cp -a hakios-upstream/devices/qemu export/source/hakios-upstream/
          mkdir -p export/build/upstream-prebuilt
          cp hakios-upstream/prebuilt/hakios-kernel export/build/upstream-prebuilt/hakios-kernel
          cp hakios-upstream/prebuilt/userland/hello export/build/upstream-prebuilt/hello
          file export/build/upstream-prebuilt/hakios-kernel > export/build/upstream-prebuilt/kernel-file.txt
          sha256sum export/build/upstream-prebuilt/hakios-kernel export/build/upstream-prebuilt/hello > export/build/upstream-prebuilt/SHA256SUMS

          cp -a hakios-upstream/docs/porting export/source/hakios-upstream/
          cp -a hakios-port/devices/on7xreflte export/source/g611mt-port/
          cp -a hakios-port/scripts export/source/g611mt-port/
          cp -a hackios-g611mt/. export/source/u-boot-dt/
          cp .github/workflows/hakios-g611mt-*.yml export/workflows/
          git rev-parse HEAD > export/PROJECT_BRANCH_COMMIT.txt
          git -C hakios-upstream rev-parse HEAD > export/UPSTREAM_HAKIOS_COMMIT.txt
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/source-checksums.sha256
      - name: Archive source snapshots and provenance without OS ROM
        uses: actions/upload-artifact@v4
        with:
          name: hakios-g611mt-source-provenance-unverified
          path: export/**
          retention-days: 14
