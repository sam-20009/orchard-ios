name: HackiOS Apple XNU 8796 real config and ARM64 entry compile

on:
  push:
    branches:
      - hackios-g611mt-uboot-20261108
    paths:
      - "hackios-g611mt/xnu-8796-original-config-probe.sh"
      - ".github/workflows/xnu-8796-config-arm64.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-xnu-arm64-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install original XNU host config generator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc bison flex csh unifdef clang llvm make
          bison --version | head -n1
          flex --version
          clang --version | head -n1
      - name: Fetch exact Apple XNU 8796.121.2 reference
        run: |
          git clone --depth 1 --branch xnu-8796.121.2 https://github.com/apple-oss-distributions/xnu.git upstream-xnu
          git -C upstream-xnu rev-parse HEAD
          test -f upstream-xnu/SETUP/config/doconf
          test -f upstream-xnu/osfmk/arm64/start.s
          test -f upstream-xnu/osfmk/arm64/genassym.c
      - name: Build real config generator, generate headers, compile XNU sources
        run: |
          set -o pipefail
          bash hackios-g611mt/xnu-8796-original-config-probe.sh 2>&1 | tee xnu-8796-probe.log

      - name: Preserve latest XNU generator and compiler diagnostics on isolated branch
        if: always()
        continue-on-error: true
        run: |
          set -u
          mkdir -p .github/hackios-ci-results/xnu8796
          for path in doconf.log config-tool.log generated-headers.txt generated-files.txt start-compile.log genassym-compile.log provenance.log; do
            source_file="xnu-config-artifacts/$path"
            if [ -f "$source_file" ]; then
              cp "$source_file" ".github/hackios-ci-results/xnu8796/$path"
            fi
          done
          if [ -f xnu-8796-probe.log ]; then
            cp xnu-8796-probe.log .github/hackios-ci-results/xnu8796/workflow-probe.log
          fi
          printf 'github_run_id=%s\nsource_commit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .github/hackios-ci-results/xnu8796/ci-run.txt
          git config user.name "HackiOS GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add .github/hackios-ci-results/xnu8796/
          if ! git diff --staged --quiet; then
            git commit -m "Preserve authentic XNU build diagnostics [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload logs and authentic build objects (not bootable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-8796-original-config-and-arm64-compile-logs
          path: |
            xnu-8796-probe.log
            xnu-config-artifacts/**
          retention-days: 7
          if-no-files-found: warn
