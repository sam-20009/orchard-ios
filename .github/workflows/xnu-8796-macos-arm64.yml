name: HackiOS original XNU 8796 ARM64 startup on macOS

on:
  push:
    branches:
      - hackios-g611mt-uboot-20261108
    paths:
      - "hackios-g611mt/xnu-8796-macos-probe.sh"
      - ".github/workflows/xnu-8796-macos-arm64.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xnu-arm64-genuine:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare macOS source build toolchain
        run: |
          set -o pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install bison flex unifdef
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - name: Clone genuine original Apple XNU 8796 source
        run: |
          git clone --depth 1 --branch xnu-8796.121.2 https://github.com/apple-oss-distributions/xnu.git upstream-xnu
          git -C upstream-xnu rev-parse HEAD
      - name: Original XNU config and assembly generation, then ARM64 compilation
        run: |
          set -o pipefail
          bash hackios-g611mt/xnu-8796-macos-probe.sh 2>&1 | tee xnu-macos-probe.log
      - name: Save all logs, headers and genuine compiled objects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-8796-macos-genuine-startup-probe
          path: |
            xnu-macos-probe.log
            xnu-macos-results/**
          if-no-files-found: warn
          retention-days: 7


      - name: Publish exact macOS compiler failures to isolated CI branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .github/hackios-ci-results/xnu8796-macos
          for name in source-commit.txt host.log config.log doconf.log generated-files.txt symbol-aliasing.log genassym.log assym.log start.log; do
            if [ -f "xnu-macos-results/$name" ]; then
              cp "xnu-macos-results/$name" ".github/hackios-ci-results/xnu8796-macos/$name"
            fi
          done
          if [ -f xnu-macos-probe.log ]; then
            cp xnu-macos-probe.log .github/hackios-ci-results/xnu8796-macos/workflow-probe.log
          fi
          echo "$GITHUB_RUN_ID" > .github/hackios-ci-results/xnu8796-macos/run-id.txt
          git config user.name "HackiOS GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add .github/hackios-ci-results/xnu8796-macos
          if ! git diff --cached --quiet; then
            git commit -m "Preserve XNU macOS ARM64 diagnostic evidence [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
